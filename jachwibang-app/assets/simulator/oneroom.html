<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원룸 배치 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #DCE3E6; --panel: rgba(247,249,250,0.94); --ink: #1E2A31; --muted: #5B6A72;
    --line: #C3CDD2; --accent: #3552A6; --accent-ink: #FFFFFF; --danger: #B03A3A;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151B20; --panel: rgba(28,36,42,0.94); --ink: #E6ECEF; --muted: #9AA8B0;
      --line: #34424B; --accent: #7F9BEA; --accent-ink: #0F1720; --danger: #E27C7C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151B20; --panel: rgba(28,36,42,0.94); --ink: #E6ECEF; --muted: #9AA8B0;
    --line: #34424B; --accent: #7F9BEA; --accent-ink: #0F1720; --danger: #E27C7C;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .hud {
    position: fixed; top: 0; left: 0; max-width: 100%;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 0 12px;
    pointer-events: none;
  }
  .card {
    pointer-events: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .panel { width: 320px; max-width: calc(100vw - 24px); display: flex; flex-direction: column;
    max-height: calc(100vh - 150px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
  .phead { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; }
  .phead > div { flex: 1; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .dims { margin: 0; color: var(--accent); font-weight: 600; font-size: 13px; }
  .pbody { overflow-y: auto; padding: 0 14px 14px; border-top: 1px solid var(--line); }
  .panel.collapsed .pbody { display: none; }
  section { padding-top: 12px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--muted); }
  .help { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; min-height: 2.6em; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button, select {
    font: inherit; font-size: 13px; color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; cursor: pointer;
  }
  select { background: var(--panel); flex: 1; min-width: 0; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:hover, select:hover { border-color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  button:disabled { opacity: 0.45; cursor: default; }
  [data-mode="erase"][aria-pressed="true"] { background: var(--danger); border-color: var(--danger); }
  .tools button { padding: 6px 4px; }
  .sizein { display: flex; gap: 10px; flex-wrap: wrap; }
  .sizein label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .sizein input { width: 76px; font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
  .sizein input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .optlabel { font-size: 13px; width: 34px; color: var(--muted); }
  #roomOpts button { padding: 4px 9px; font-size: 12.5px; }
  #bathPosRow button { padding: 3px 8px; font-size: 12px; }
  #winEdit .row button, [data-face] { padding: 4px 9px; font-size: 12.5px; }
  #winList button { padding: 4px 10px; font-size: 12.5px; }
  .slider { display: grid; grid-template-columns: 52px 1fr 86px; gap: 8px; align-items: center; margin-bottom: 4px; }
  .slider label { font-size: 13px; }
  .slider output { font-size: 12.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 5px; }
  .chip { width: 18px; height: 18px; border-radius: 5px; border: 1px solid rgba(0,0,0,0.15); display: inline-block; }
  .colorpick { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; border: 1px solid var(--line); border-radius: 9px; padding: 2px 9px 2px 4px; }
  input[type="color"] { width: 24px; height: 24px; border: 0; padding: 0; background: none; cursor: pointer; }
  .ghost { border-color: transparent; color: var(--muted); padding: 3px 8px; }

  body.walking .hud, body.walking .selbar { display: none !important; }
  #walkHud[hidden] { display: none; }
  .crosshair { position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%;
    background: rgba(255,255,255,0.9); box-shadow: 0 0 0 1.5px rgba(0,0,0,0.45); pointer-events: none; }
  .walkPrompt { position: fixed; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); padding: 4px 10px; border-radius: 8px;
    background: rgba(20,26,31,0.72); color: #fff; font-size: 13px; pointer-events: none; white-space: nowrap; }
  .walkPrompt:empty { display: none; }
  .walkTop { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 10px 0; }
  .walkHelp { display: flex; align-items: center; gap: 12px; padding: 8px 12px; font-size: 12.5px; color: var(--muted); max-width: 760px; }
  .walkHelp strong { color: var(--ink); white-space: nowrap; }
  .walkHelp button { white-space: nowrap; flex-shrink: 0; }
  @media (max-width: 700px) { .walkHelp span { display: none; } }
  .walkPad { position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: grid;
    grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 6px; }
  .walkPad button { background: var(--panel); font-size: 18px; padding: 0; border-radius: 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .walkPad [data-k="KeyW"] { grid-column: 2; grid-row: 1; }
  .walkPad [data-k="KeyA"] { grid-column: 1; grid-row: 2; }
  .walkPad [data-k="KeyS"] { grid-column: 2; grid-row: 2; }
  .walkPad [data-k="KeyD"] { grid-column: 3; grid-row: 2; }
  .walkPad #padUse { grid-column: 3; grid-row: 1; font-size: 15px; font-weight: 600; }
  @media (hover: hover) and (pointer: fine) { .walkPad { display: none; } }
  .selbar {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
    padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 12px); pointer-events: none;
  }
  .selbar[hidden] { display: none; }
  .selbar .card { padding: 10px 14px; width: 440px; max-width: 100%; }
  .seltop { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .selname { font-weight: 600; }
  .selsize { color: var(--muted); font-size: 12.5px; flex: 1; }
  .danger { color: var(--danger); }
  .selbar .slider { grid-template-columns: 58px 1fr 54px auto; }
  .steps { display: inline-flex; gap: 4px; }
  #colorRow { margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
  .colorhead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .clabel { font-size: 13px; width: 32px; }
  .parts { display: inline-flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .parts button { padding: 2px 9px; font-size: 12px; }
  .fsws { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .fsw { width: 26px; height: 26px; padding: 0; border-radius: 7px; border: 1px solid rgba(0,0,0,0.18); }
  .fsw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; background-clip: padding-box; }
  .fsws input[type="color"] { width: 26px; height: 26px; }
  .steps button { padding: 3px 7px; font-size: 12px; }

  /* ---------- 패널: 화면 아래쪽 시트 + 탭 칩 (모든 화면 크기) ---------- */
  .hud {
    top: auto; bottom: 0; left: 0; right: 0; width: 100%;
    display: flex; justify-content: center;
    padding: 0 8px calc(env(safe-area-inset-bottom, 0px) + 8px);
  }
  .panel { width: 100%; max-width: 760px; max-height: none; border-radius: 16px; }
  .phead { display: none; }
  .mtabs { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 10px; }
  .mtabs .chips {
    display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0;
    scrollbar-width: none; -webkit-overflow-scrolling: touch; cursor: grab;
    touch-action: pan-x; user-select: none; -webkit-user-select: none;
  }
  .mtabs .chips.dragging { cursor: grabbing; }
  .mtabs .chips::-webkit-scrollbar { display: none; }
  .mtabs button { white-space: nowrap; flex-shrink: 0; padding: 6px 11px; border-radius: 999px; }
  .mtabs .fold { border-color: transparent; color: var(--muted); padding: 6px 8px; }
  .pbody { max-height: min(40vh, 340px); padding: 0 12px 12px; }
  .pbody > section { display: none; }
  .pbody > section.active { display: block; }
  .pbody > section > h2 { display: none; }
  .help { min-height: 0; }
  body.has-sel .hud { display: none; }
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud">
  <div class="card panel" id="panel">
    <div class="phead">
      <div>
        <h1>원룸 배치 시뮬레이터</h1>
        <p class="dims" id="dims"></p>
      </div>
      <button class="ghost" id="collapseBtn" aria-expanded="true">접기</button>
    </div>
    <div class="pbody">
      <section>
        <h2>도구</h2>
        <div class="tools" role="group" aria-label="도구">
          <button data-mode="move" aria-pressed="true">이동</button>
          <button data-mode="resize" aria-pressed="false">방 크기</button>
          <button data-mode="wall" aria-pressed="false">벽 그리기</button>
          <button data-mode="room" aria-pressed="false">방 만들기</button>
          <button data-mode="partition" aria-pressed="false">칸막이</button>
          <button data-mode="shelfwall" aria-pressed="false">수납 칸</button>
          <button data-mode="erase" aria-pressed="false">지우개</button>
          <button id="undoBtn" disabled>되돌리기</button>
        </div>
        <p class="help" id="modeHelp"></p>
        <div id="roomOpts" hidden>
          <div class="row" role="group" aria-label="입구 방향" style="margin-top:6px">
            <span class="optlabel">입구</span>
            <button data-entry="top" aria-pressed="false">위</button>
            <button data-entry="bottom" aria-pressed="true">아래</button>
            <button data-entry="left" aria-pressed="false">왼쪽</button>
            <button data-entry="right" aria-pressed="false">오른쪽</button>
            <button data-entry="none" aria-pressed="false">없음</button>
          </div>
          <div class="row" role="group" aria-label="입구에 달 문" style="margin-top:6px">
            <span class="optlabel">문</span>
            <button data-rdoor="door" aria-pressed="true">여닫이</button>
            <button data-rdoor="slidedoor" aria-pressed="false">미닫이</button>
            <button data-rdoor="none" aria-pressed="false">안 달기</button>
          </div>
        </div>
      </section>

      <section>
        <h2>방 크기</h2>
        <div class="sizein">
          <label>가로 <input id="roomW" type="number" inputmode="numeric" min="200" max="900" step="5"> cm</label>
          <label>세로 <input id="roomD" type="number" inputmode="numeric" min="250" max="1200" step="5"> cm</label>
        </div>
        <p class="help" id="roomMsg" style="min-height:0">숫자를 입력하고 Enter를 누르세요. 위쪽·왼쪽 벽은 그대로 두고 오른쪽·아래 벽이 움직여요.</p>
      </section>

      <section>
        <h2>햇빛과 커튼</h2>
        <div class="slider"><label for="timeIn">시간</label><input id="timeIn" type="range" min="5" max="22" step="0.25" value="8"><output id="timeOut"></output></div>
        <div class="row" role="group" aria-label="위쪽 벽이 향하는 방향" style="margin-bottom:8px">
          <span class="optlabel" style="width:auto">위쪽 벽</span>
          <button data-face="S" aria-pressed="true">남향</button>
          <button data-face="E" aria-pressed="false">동향</button>
          <button data-face="W" aria-pressed="false">서향</button>
          <button data-face="N" aria-pressed="false">북향</button>
        </div>
        <div class="row">
          <button id="openAll">커튼 모두 열기</button>
          <button id="closeAll">커튼 모두 닫기</button>
          <button id="lightBtn" aria-pressed="false">실내 조명 켜기</button>
        </div>
      </section>

      <section>
        <h2>창문</h2>
        <div class="row" id="winList" role="group" aria-label="창문 선택"></div>
        <div id="winEdit">
          <div class="row" role="group" aria-label="창문이 달린 벽" style="margin-top:8px">
            <span class="optlabel">벽</span>
            <button data-wall="n">위</button><button data-wall="s">아래</button><button data-wall="w">왼쪽</button><button data-wall="e">오른쪽</button>
          </div>
          <div class="row" role="group" aria-label="창문 종류" style="margin:6px 0 8px">
            <span class="optlabel">종류</span>
            <button data-win="normal">일반 창</button><button data-win="full">통창</button><button data-win="small">작은 창</button>
          </div>
          <div class="slider"><label for="winW">가로</label><input id="winW" type="range" min="0.4" max="3.5" step="0.05"><output id="winWOut"></output></div>
          <div class="slider"><label for="winH">높이</label><input id="winH" type="range" min="0.3" max="2.33" step="0.05"><output id="winHOut"></output></div>
          <div class="slider"><label for="winS">창턱</label><input id="winS" type="range" min="0" max="2" step="0.05"><output id="winSOut"></output></div>
          <div class="slider"><label for="winO">위치</label><input id="winO" type="range" min="-1" max="1" step="0.05"><output id="winOOut"></output></div>
          <div class="slider"><label for="winC">커튼</label><input id="winC" type="range" min="0" max="100" step="1"><output id="winCOut"></output></div>
          <div class="row"><button class="ghost danger" id="winDel">이 창문 삭제</button></div>
        </div>
        <p class="help" id="winMsg">창문을 직접 끌면 벽을 따라 옮겨지고, 위아래로 끌면 높이가 바뀌어요.</p>
      </section>

      <section>
        <h2>바닥재</h2>
        <div class="swatches" id="floorSw"></div>
      </section>

      <section>
        <h2>벽지</h2>
        <div class="swatches" id="wallSw"></div>
      </section>

      <section>
        <h2>화장실 타일</h2>
        <p class="help" style="min-height:0;margin:0 0 6px">바닥</p>
        <div class="swatches" id="bathFloorSw"></div>
        <p class="help" style="min-height:0;margin:10px 0 6px">벽</p>
        <div class="swatches" id="bathWallSw"></div>
      </section>

      <section>
        <h2>가구 추가</h2>
        <div class="row"><select id="addSel" aria-label="추가할 가구"></select><button id="addBtn">추가</button></div>
      </section>

      <section>
        <h2>보기</h2>
        <div class="row">
          <button id="view3d" aria-pressed="true">3D 보기</button>
          <button id="viewTop" aria-pressed="false">위에서 보기</button>
          <button id="cutBtn" aria-pressed="false">벽 낮춰 보기</button>
          <button id="resetBtn">방 비우기</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="primary" id="walkBtn">1인칭으로 둘러보기</button>
          <label class="sizein" style="gap:6px;font-size:13px">키 <input id="heightIn" type="number" min="100" max="220" step="1" value="170" style="width:62px"> cm</label>
        </div>
      </section>
    </div>
  </div>
</div>

<div id="walkHud" hidden>
  <div class="crosshair" aria-hidden="true"></div>
  <div class="walkPrompt" id="walkPrompt" aria-live="polite"></div>
  <div class="walkTop">
    <div class="card walkHelp">
      <strong>1인칭 둘러보기</strong>
      <span>WASD·방향키 이동 · Shift 달리기 · 화면을 클릭하면 마우스로 둘러보기(드래그도 돼요) · E 또는 클릭으로 문 열기·조명 켜기 · Esc 두 번 누르면 나가기</span>
      <button id="walkExit">나가기</button>
    </div>
  </div>
  <div class="walkPad" aria-label="이동 버튼">
    <button data-k="KeyW" aria-label="앞으로">▲</button>
    <button data-k="KeyA" aria-label="왼쪽">◀</button>
    <button data-k="KeyS" aria-label="뒤로">▼</button>
    <button data-k="KeyD" aria-label="오른쪽">▶</button>
    <button id="padUse" aria-label="문 열기, 조명">E</button>
  </div>
</div>

<div class="selbar" id="selbar" hidden>
  <div class="card">
    <div class="seltop">
      <span class="selname" id="selName"></span>
      <span class="selsize" id="selSize"></span>
      <button id="lampBtn" aria-pressed="true" hidden>불 끄기</button>
      <button id="doorBtn" aria-pressed="false" hidden>문 열기</button>
      <button class="ghost danger" id="delRoomBtn" hidden>방 전체 삭제</button>
      <button class="ghost danger" id="delBtn">삭제</button>
    </div>
    <div class="slider">
      <label for="angIn">각도</label>
      <input id="angIn" type="range" min="0" max="359" step="1" value="0">
      <output id="angOut">0°</output>
      <span class="steps"><button id="angMinus" aria-label="15도 반시계">−15°</button><button id="angPlus" aria-label="15도 시계">+15°</button></span>
    </div>
    <div class="row" id="bathPosRow" role="group" aria-label="화장실 위치" style="margin-bottom:6px">
      <span class="optlabel" style="width:58px">위치</span>
      <button data-corner="lt">왼쪽 위</button><button data-corner="rt">오른쪽 위</button>
      <button data-corner="lb">왼쪽 아래</button><button data-corner="rb">오른쪽 아래</button>
    </div>
    <div class="slider" id="liftRow"><label for="liftIn">놓는 높이</label><input id="liftIn" type="range" min="0" max="1.5" step="0.01"><output id="liftOut"></output><span></span></div>
    <div id="sizeRows">
      <div class="slider"><label for="wIn">가로</label><input id="wIn" type="range" min="0.2" max="3" step="0.05"><output id="wOut"></output><span></span></div>
      <div class="slider"><label for="dIn">세로</label><input id="dIn" type="range" min="0.2" max="3" step="0.05"><output id="dOut"></output><span></span></div>
      <div class="slider" id="hRow"><label for="hIn">높이</label><input id="hIn" type="range" min="0.2" max="2.4" step="0.05"><output id="hOut"></output><span></span></div>
    </div>
    <div id="colorRow">
      <div class="colorhead"><span class="clabel">색상</span><span class="parts" id="partRow" role="group" aria-label="색을 바꿀 부분"></span><button class="ghost" id="colorReset">원래 색</button></div>
      <div class="fsws" id="furnSw"></div>
    </div>
    <div class="slider" id="lenRow">
      <label for="lenIn">길이</label>
      <input id="lenIn" type="range" min="0.3" max="8" step="0.05" value="1">
      <output id="lenOut"></output>
      <span></span>
    </div>
  </div>
</div>

      if (g) {
        const f = FURN[g.userData.key];
        if (f && f.isDoor) return { kind: 'door', g: g };
        if (o.userData.bathDoor) return { kind: 'door', g: g };
        if (g.userData.lightObj) return { kind: 'lamp', g: g };
      }
      return null;   // something else is in front
    }
    return null;
  }
  function useTarget() {
    const t = aimTarget(); if (!t) return;
    if (t.kind === 'entrance') { entranceOpen = !entranceOpen; buildRoom(); applyEnv(); }
    else if (t.kind === 'door') { t.g.userData.open = !t.g.userData.open; rebuildItem(t.g); }
    else if (t.kind === 'lamp') { t.g.userData.on = !t.g.userData.on; applyLamp(t.g); }
  }
  function walkPrompt() {
    const t = aimTarget();
    let txt = '';
    if (t && t.kind === 'entrance') txt = 'E · 현관문 ' + (entranceOpen ? '닫기' : '열기');
    else if (t && t.kind === 'door') txt = 'E · 문 ' + (t.g.userData.open ? '닫기' : '열기');
    else if (t && t.kind === 'lamp') txt = 'E · ' + t.g.userData.name + ' ' + (t.g.userData.on ? '끄기' : '켜기');
    if ($('walkPrompt').textContent !== txt) $('walkPrompt').textContent = txt;
  }
  function enterWalk() {
    if (walk) return;
    select(null); setMode('move'); if (winActive) winActive = false;
    saved = { pos: camera.position.clone(), target: controls.target.clone() };
    cutBeforeWalk = cut; if (cut) { cut = false; applyCut(); }
    walk = true; fly = null; controls.enabled = false;
    document.body.classList.add('walking'); $('walkHud').hidden = false;
    camera.fov = 70; camera.near = 0.05; camera.clearViewOffset(); camera.updateProjectionMatrix();
    // start outside the front door, facing it
    WP.set(R.xMin + 0.75, 0, R.zMax + 1.1); yaw = 0; pitch = 0;
    buildRoom(); applyEnv();
    canvas.style.cursor = 'crosshair';
  }
  function exitWalk() {
    if (!walk) return;
    walk = false; Object.keys(keys).forEach((k) => { keys[k] = false; });
    if (document.pointerLockElement) document.exitPointerLock();
    document.body.classList.remove('walking'); $('walkHud').hidden = true;
    camera.fov = 45; camera.near = 0.1; camera.rotation.set(0, 0, 0);
    camera.position.copy(saved.pos); controls.target.copy(saved.target);
    applyViewOffset(); controls.enabled = true; controls.update();
    if (cutBeforeWalk) { cut = true; applyCut(); }
    buildRoom(); applyEnv(); canvas.style.cursor = 'default';
  }
  function walkStep(dt) {
    const run = keys.ShiftLeft || keys.ShiftRight;
    let f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    let r = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    let moving = false;
    if (f || r) {
      const n = Math.hypot(f, r); f /= n; r /= n;
      const sp = (run ? 2.6 : 1.4) * Math.min(dt, 0.1);
      const mx = (-Math.sin(yaw) * f + Math.cos(yaw) * r) * sp, mz = (-Math.cos(yaw) * f - Math.sin(yaw) * r) * sp;
      if (!blocked(mx, 0)) { WP.x += mx; moving = true; }
      if (!blocked(0, mz)) { WP.z += mz; moving = true; }
    }
    bobT = moving ? bobT + dt * (run ? 11 : 7.5) : bobT * 0.9;
    const bob = reduceMotion ? 0 : Math.sin(bobT) * 0.018;
    camera.position.set(WP.x, eyeHeight() + bob, WP.z);
    camera.rotation.set(pitch, yaw, 0, 'YXZ');
    walkPrompt();
  }
  function lookBy(dx, dy) {
    yaw -= dx * 0.0028; pitch -= dy * 0.0028;
    pitch = Math.max(-1.45, Math.min(1.45, pitch));
  }
  function walkDown(e) { look = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, id: e.pointerId }; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  function walkMove(e) {
    if (document.pointerLockElement === canvas) { lookBy(e.movementX || 0, e.movementY || 0); return; }
    if (look && e.pointerId === look.id) { lookBy(e.clientX - look.x, e.clientY - look.y); look.x = e.clientX; look.y = e.clientY; }
  }
  function walkUp(e) {
    const wasClick = look && Math.hypot(e.clientX - look.sx, e.clientY - look.sy) < 5;
    look = null;
    if (!wasClick && document.pointerLockElement !== canvas) return;
    if (aimTarget()) useTarget();
    else if (document.pointerLockElement !== canvas && e.pointerType === 'mouse' && canvas.requestPointerLock) {
      try { const pr = canvas.requestPointerLock(); if (pr && pr.catch) pr.catch(function () {}); } catch (err) {}
    }
  }
  window.addEventListener('keydown', function (e) {
    if (!walk || e.target.tagName === 'INPUT') return;
    if (e.code === 'Escape') { exitWalk(); return; }
    if (e.code === 'KeyE' || e.code === 'Space') { e.preventDefault(); if (!e.repeat) useTarget(); return; }
    if (/^(Key[WASD]|Arrow(Up|Down|Left|Right)|Shift(Left|Right))$/.test(e.code)) { e.preventDefault(); keys[e.code] = true; }
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });
  window.addEventListener('blur', function () { Object.keys(keys).forEach((k) => { keys[k] = false; }); });
  $('walkBtn').addEventListener('click', enterWalk);
  $('walkExit').addEventListener('click', exitWalk);
  $('padUse').addEventListener('click', useTarget);
  document.querySelectorAll('.walkPad [data-k]').forEach(function (b) {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[k] = true; });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, () => { keys[k] = false; }));
  });

  // ---------- loop ----------
  const tmp = new THREE.Vector3(), clock = new THREE.Clock();
  function tick() {
    const dt = clock.getDelta();
    if (fly) {
      fly.t = Math.min(1, fly.t + dt / 0.7);
      const k = 1 - Math.pow(1 - fly.t, 3);
      camera.position.lerpVectors(fly.fromP, fly.toP, k);
      controls.target.lerpVectors(fly.fromT, fly.toT, k);
      if (fly.t >= 1) fly = null;
    }
    if (walk) walkStep(dt); else controls.update();
    if (curtainAnim) {
      curtainAnim.t = Math.min(1, curtainAnim.t + dt / 1.4);
      const k = curtainAnim.t < 0.5 ? 2 * curtainAnim.t * curtainAnim.t : 1 - Math.pow(-2 * curtainAnim.t + 2, 2) / 2;
      WINS.forEach(function (w, i) { const f0 = curtainAnim.from[i] !== undefined ? curtainAnim.from[i] : w.curtain; w.curtain = f0 + (curtainAnim.to - f0) * k; updateCurtain(w); });
      applyEnv();
      if (curtainAnim.t >= 1) { curtainAnim = null; syncWinUI(); }
    }

    // walls facing the camera become invisible but still cast shadows (so curtains/walls keep blocking sun)
    outerWalls.forEach(function (w) {
      tmp.copy(camera.position).sub(w.center);
      const hide = !walk && tmp.dot(w.normal) > 0.15;
      if (hide !== w.hidden) {
        w.hidden = hide;
        w.g.traverse(function (m) { if (m.isMesh) m.material = hide ? M.hiddenWall : m.userData.mat; });
      }
    });

    const lampItem = movables.find((g) => g.userData.lamp);
    if (lampItem && lightsOn) { lampItem.userData.lamp.getWorldPosition(tmp); lampLight.position.copy(tmp).setY(tmp.y + 0.12); lampLight.intensity = 0.9; }
    else lampLight.intensity = 0;

    eraseOutline.visible = mode === 'erase' && !!hoverItem && movables.indexOf(hoverItem) >= 0;
    if (eraseOutline.visible) {
      const hu = hoverItem.userData;
      eraseOutline.position.set(hoverItem.position.x, 0.03, hoverItem.position.z);
      eraseOutline.rotation.y = hoverItem.rotation.y;
      eraseOutline.scale.set(hu.w + 0.1, 1, hu.d + 0.1);
    }
    if (selected) {
      const u = selected.userData;
      outline.position.set(selected.position.x, 0.02, selected.position.z);
      outline.rotation.y = selected.rotation.y;
      outline.scale.set(u.w + 0.08, 1, u.d + 0.08);
    }
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
